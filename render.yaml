services:
  - type: web
    name: layerfox-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_SPACE_ID
        value: 24yearsold/see-through-demo
      - key: HF_API_NAME
        value: ""
      - key: PYTHON_VERSION
        value: 3.11.9
